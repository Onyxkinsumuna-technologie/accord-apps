name: Build Accord
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Bibliothèque Excel en local (mode hors ligne)
        run: |
          cp node_modules/xlsx-js-style/dist/xlsx.bundle.js www/xlsx.bundle.js
          sed -i 's#https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js#xlsx.bundle.js#' www/index.html
      - run: npm run win
      - uses: actions/upload-artifact@v4
        with: { name: Accord-Windows-exe, path: dist/*.exe }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Bibliothèque Excel en local (mode hors ligne)
        run: |
          cp node_modules/xlsx-js-style/dist/xlsx.bundle.js www/xlsx.bundle.js
          sed -i 's#https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js#xlsx.bundle.js#' www/index.html
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: Accord-Android-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: fichiers }
      - run: |
          mv fichiers/Accord-Windows-exe/*.exe Accord-Windows.exe
          mv fichiers/Accord-Android-apk/app-debug.apk Accord-Android.apk
      - uses: softprops/action-gh-release@v2
        with: { files: "Accord-Windows.exe\nAccord-Android.apk" }
